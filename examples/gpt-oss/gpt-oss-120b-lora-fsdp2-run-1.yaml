### Key changes from gpt-oss-120b-fft-fsdp2-offload.yaml
### - Using LoRA instead of full fine-tuning
### - Increased sequence length to 16384, as this should increase GPU utilization
### - Changed from using gradient_checkpointing to fsdp_config.activation_checkpointing
### - Add PyTorch profiling

### MODEL
base_model: axolotl-ai-co/gpt-oss-120b-dequantized

bf16: true

special_tokens:
eot_tokens:
  - "<|end|>"

experimental_skip_move_to_device: true  # prevent OOM by NOT putting model to GPU before sharding

use_kernels: false
flash_attention: true
attn_implementation: kernels-community/vllm-flash-attn3  # this is not needed if using flash_attn >= 2.8.3
plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

torch_compile: true

### PARALLELISM
dp_shard_size: 8  # 8xH100; optional since if not set, will use all available devices

fsdp_version: 2
# https://huggingface.co/docs/accelerate/en/usage_guides/fsdp
fsdp_config:
  activation_checkpointing: true
  offload_params: false
  cpu_ram_efficient_loading: true
  sync_module_states: true
  use_orig_params: true # for LoRA; https://dev-discuss.pytorch.org/t/rethinking-pytorch-fully-sharded-data-parallel-fsdp-from-first-principles/1019
  state_dict_type: FULL_STATE_DICT
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: GptOssDecoderLayer
  reshard_after_forward: true

### DATA
datasets:
  - path: /workspace/axolotl/data/train.jsonl
    field: input
    type: completion

dataset_prepared_path: dataset_prepared_last_run
val_set_size: 0.05

sequence_len: 8192 # dummy to not delete any overlong rows
pad_to_sequence_len: false
gradient_accumulation_steps: 1
micro_batch_size: 8

### LORA
adapter: lora
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0  # dropout not supported when using LoRA over expert parameters
lora_target_linear: true  # this only targets attention linears due to peft not being able to target gpt-oss's nn.Parameter's in experts

### LEARNING
num_epochs: 1
optimizer: adamw_torch_fused  # 8bit optimizers do not work with FSDP2 offload
lr_scheduler: constant_with_warmup
learning_rate: 2e-5
warmup_ratio: 0.03

### OBSERVABILITY
wandb_project: gpt-oss-120b-bf16-lora-fsdp2
wandb_entity: 
wandb_watch:
wandb_name: gpt-oss-120b-bf16-lora-fsdp2-run-1
wandb_log_model:

output_dir: /workspace/outputs/gpt-oss-120b-bf16-lora-fsdp2-run-1/
logging_steps: 1
memory_profiler_steps: 1000
pytorch_profiler_steps_wait: 1
pytorch_profiler_steps_warmup: 1
pytorch_profiler_steps_active: 1

save_strategy: "no"